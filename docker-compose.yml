services:  
  db:
    image: postgres:16.4-alpine
    container_name: postgres_container
    hostname: postgres16
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:Z
    networks:
      - db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  
  pgadmin:
    image: dpage/pgadmin4:8.11.0
    env_file:
      - .env
    container_name: pgadmin_container
    environment:
      POSTGRES_HOST: postgres16
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGADMIN_PORT: ${PGADMIN_PORT}
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - ./pgadmin-init.sh:/entrypoint_custom.sh:Z
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    user: root
    entrypoint: /entrypoint_custom.sh
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - db_network


  auth:
    image: supabase/gotrue:v2.146.0
    container_name: gotrue_container
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${GOTRUE_PORT}:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?search_path=auth
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      API_EXTERNAL_URL: http://localhost:${GOTRUE_PORT}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 10s
      retries: 3
      start_period: 5s
    networks:
      - db_network

  api:
    build: ./api
    container_name: express_api_container
    ports:
      - "3000:3000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${GOTRUE_JWT_SECRET}
      PORT: 3000
    volumes:
      - ./api:/app:Z
      - /app/node_modules
    command: npm run dev
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - db_network



networks:
  db_network:


volumes:
  pg_data:
  pgadmin_data: